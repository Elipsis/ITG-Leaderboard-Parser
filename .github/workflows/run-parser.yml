name: Generate Fresh Leaderboard

on:
  push:
    paths:
      - 'Input/Stats.xml'

permissions:
  contents: write

jobs:
  run-parser:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Leaderboard Script
      run: |
        python "itg leaderboard.py"

    - name: Commit and Push Leaderboard Updates
      run: |
        git config --global user.name "GitHub Actions Runner"
        git config --global user.email "actions@github.com"
        git add .
        if git diff --stat --cached --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Automated leaderboard update: $(date)"
          git push
        fi